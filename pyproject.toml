[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zfstreemap"
version = "0.1.0"
description = "Interactive treemap of ZFS dataset and snapshot space usage"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zfstreemap = "zfstreemap.__main__:main"

[tool.setuptools]
packages = ["zfstreemap"]

[tool.setuptools.package-data]
zfstreemap = ["static/*"]
